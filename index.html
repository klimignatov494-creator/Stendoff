<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Помощь в игре</title>
<style>
:root{--a:#7c5cff;--b:#00d4ff;--c:#ff4fd8;--bg:#0b0b1a;--card:rgba(255,255,255,.07);--t:#f2f2ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0}
#wipe{position:fixed;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--c),var(--b));z-index:50;transform:translate(-50%,-50%) scale(0);pointer-events:none}
#wipe.go{animation:wipe .9s ease-in-out}
@keyframes wipe{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{transform:translate(-50%,-50%) scale(400);opacity:1}100%{transform:translate(-50%,-50%) scale(400);opacity:0}}
.screen{position:relative;z-index:2;min-height:100vh;display:none;flex-direction:column;align-items:center;padding:24px 16px}
.screen.on{display:flex;animation:in .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.9);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
h1{font-size:clamp(28px,6vw,48px);text-align:center;margin:8vh 0 28px;background:linear-gradient(90deg,var(--b),var(--a),var(--c),var(--b));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:300%}}
.roles{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.role{width:250px;padding:34px 20px;text-align:center;border-radius:22px;background:var(--card);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(14px);cursor:pointer;transition:transform .25s,box-shadow .25s;animation:float 4s ease-in-out infinite;position:relative;overflow:hidden}
.role:nth-child(2){animation-delay:-2s}
.role:hover{transform:translateY(-10px) scale(1.06) rotate(-1deg);box-shadow:0 0 40px var(--a),0 0 80px rgba(0,212,255,.3)}
.role .ic{font-size:60px;display:block;margin-bottom:10px;transition:transform .4s}
.role:hover .ic{transform:rotate(360deg) scale(1.2)}
.role b{font-size:22px}.role p{opacity:.7;font-size:14px;margin-top:6px}
@keyframes float{50%{transform:translateY(-8px)}}
.panel{width:100%;max-width:460px;background:var(--card);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:26px;backdrop-filter:blur(14px);margin-top:6vh}
.panel h2{margin-bottom:16px;text-align:center}
label{display:block;margin:14px 0 6px;font-size:14px;opacity:.8}
input[type=text],textarea{width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:var(--t);font-size:16px;outline:none;transition:.25s;font-family:inherit}
input[type=text]:focus,textarea:focus{border-color:var(--b);box-shadow:0 0 18px rgba(0,212,255,.5);transform:scale(1.02)}
textarea{min-height:130px;resize:vertical}
.btn{position:relative;overflow:hidden;border:0;padding:13px 24px;border-radius:14px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--c));transition:transform .2s,box-shadow .2s;margin-top:16px}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 8px 30px rgba(124,92,255,.7)}
.btn:active{transform:scale(.96)}
.btn.g{background:rgba(255,255,255,.12)}
.btn.full{width:100%}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.ava{width:110px;height:110px;border-radius:50%;margin:8px auto;background:rgba(255,255,255,.1) center/cover;border:3px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;animation:pulse 2.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,212,255,.6)}100%{box-shadow:0 0 0 24px rgba(0,212,255,0)}}
.top{width:100%;max-width:760px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border-radius:18px;padding:12px 16px;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(14px)}
.top .mini{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15) center/cover;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.top .sp{flex:1;min-width:120px}.top small{opacity:.7}
.top .btn{margin:0;padding:10px 16px;font-size:14px}
.wrap{width:100%;max-width:760px;margin-top:16px}
.search{width:100%;margin-bottom:14px}
.posts{display:grid;gap:14px}
.post{background:var(--card);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:16px;backdrop-filter:blur(10px);animation:in .6s both;transition:transform .25s,box-shadow .25s}
.post:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 0 30px rgba(124,92,255,.5)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph .mini{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15) center/cover;flex:none}
.post p{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.post img{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-top:10px}
.empty{text-align:center;opacity:.6;padding:40px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
#modal.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
#modal .panel{margin:0;max-height:90vh;overflow:auto;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}}
.idbox{margin-top:16px;padding:14px;border-radius:14px;background:rgba(0,212,255,.12);border:1px dashed var(--b);text-align:center}
.idbox b{font-size:20px;color:var(--b);user-select:all}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,100px);background:linear-gradient(135deg,var(--a),var(--b));padding:12px 22px;border-radius:30px;z-index:60;transition:transform .5s cubic-bezier(.2,1.5,.4,1)}
#toast.on{transform:translate(-50%,0)}
.demo{background:#ff9f1a;color:#000;padding:6px 12px;border-radius:10px;font-size:12px;margin-top:10px;max-width:760px;text-align:center;display:none}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:70;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="wipe"></div>
<div id="toast"></div>

<!-- Выбор роли -->
<section class="screen" id="s-role">
  <h1>Вы являетесь?</h1>
  <div class="roles">
    <div class="role" data-role="receiver"><span class="ic">🙏</span><b>Получающим</b><p>Прошу помощь в игре</p></div>
    <div class="role" data-role="giver"><span class="ic">🎁</span><b>Отдающим</b><p>Готов помочь другим</p></div>
  </div>
</section>

<!-- Регистрация получающего -->
<section class="screen" id="s-reg">
  <div class="panel">
    <h2>Расскажи о себе</h2>
    <div class="ava" id="regAva">📷</div>
    <input type="file" id="regFile" accept="image/*" hidden>
    <p style="text-align:center;font-size:13px;opacity:.7">Нажми на круг, чтобы загрузить фото профиля</p>
    <label>Твой игровой ID</label>
    <input type="text" id="regId" placeholder="Например, 123456789" maxlength="40">
    <button class="btn full" id="regGo">Продолжить →</button>
    <button class="btn g full" id="regBack">Назад</button>
  </div>
</section>

<!-- Главное меню -->
<section class="screen" id="s-main">
  <div class="top">
    <div class="mini" id="myAva">👤</div>
    <div class="sp"><b id="myName">Гость</b><br><small id="myRole"></small></div>
    <button class="btn" id="createBtn" style="display:none">✍️ Создать пост</button>
    <button class="btn g" id="changeRole">🔄 Изменить роль</button>
  </div>
  <div class="demo" id="demo">Демо-режим: данные хранятся только в этом браузере. Подключи Firebase (см. CFG в коде), чтобы объявления видели все.</div>
  <div class="wrap">
    <input type="text" class="search" id="search" placeholder="🔍 Поиск объявлений...">
    <div class="posts" id="posts"></div>
  </div>
</section>

<!-- Создание поста -->
<section class="screen" id="s-create">
  <div class="panel">
    <h2>Новое объявление</h2>
    <label>Что тебе нужно?</label>
    <textarea id="pText" placeholder="Опиши, с чем нужна помощь..."></textarea>
    <label>Изображение (по желанию)</label>
    <input type="file" id="pFile" accept="image/*">
    <img id="pPrev" style="width:100%;border-radius:12px;margin-top:10px;display:none">
    <button class="btn full" id="pGo">Далее →</button>
    <button class="btn g full" id="pBack">Отмена</button>
  </div>
</section>

<!-- Окно отклика -->
<div id="modal"><div class="panel" id="mBody"></div></div>

<script>
// ====== НАСТРОЙКА ОБЩЕЙ БАЗЫ (Firebase Realtime Database) ======
// databaseURL - адрес базы. apiKey - ключ веб-приложения Firebase: с ним удалять пост может только его автор (нужен вход Anonymous).
// Пусто в databaseURL = демо-режим (только этот браузер).
const CFG = { databaseURL: 'https://standoff-176b9-default-rtdb.firebaseio.com', apiKey: 'AIzaSyBkRO6g0x2npUa2T_JwM-_HBI4JVk8fftc' };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Память браузера заполнена')}} };
let me = LS.get('me', null);
let posts = [];

// ====== БАЗА ======
const DB = (CFG.databaseURL || '').replace(/\/+$/, '');
const online = !!DB;
let tok = null, tokExp = 0, authUid = null;
const myId = () => authUid || (me && me.uid);
const q = () => tok ? `?auth=${tok}` : '';
async function auth(){ // анонимный вход Firebase: даёт каждому браузеру постоянный id, по нему правила проверяют автора
  if(!CFG.apiKey) return;
  if(tok && Date.now() < tokExp) return;
  let j = null; const rt = LS.get('rt', null);
  if(rt){
    const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${CFG.apiKey}`, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(rt)}` });
    if(r.ok){ const t = await r.json(); j = { idToken:t.id_token, refreshToken:t.refresh_token, localId:t.user_id, expiresIn:t.expires_in }; }
  }
  if(!j){
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${CFG.apiKey}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ returnSecureToken:true }) });
    if(!r.ok) throw new Error('auth'); j = await r.json();
  }
  tok = j.idToken; tokExp = Date.now() + (j.expiresIn - 120) * 1000; authUid = j.localId; LS.set('rt', j.refreshToken);
}
const api = {
  async list(){
    if(!online) return LS.get('posts', []);
    try { await auth(); } catch {}
    const r = await fetch(`${DB}/posts.json`);
    if(!r.ok) throw new Error('db');
    const j = await r.json() || {};
    return Object.entries(j).map(([id, p]) => ({ ...p, id }))
      .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))).slice(0, 200);
  },
  async add(p){
    p.created_at = new Date().toISOString();
    if(!online){ const a = LS.get('posts', []); p.id = Date.now(); a.unshift(p); LS.set('posts', a); return; }
    await auth(); if(authUid) p.author = authUid;
    const r = await fetch(`${DB}/posts.json${q()}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) });
    if(!r.ok) throw new Error('db');
  },
  async del(id){
    if(!online){ LS.set('posts', LS.get('posts', []).filter(p => String(p.id) !== String(id))); return; }
    await auth();
    const r = await fetch(`${DB}/posts/${encodeURIComponent(id)}.json${q()}`, { method: 'DELETE' });
    if(!r.ok) throw new Error('db');
  }
};

// ====== ПЕРЕХОДЫ ======
let busy = false;
function go(id, instant){
  const show = () => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $('#'+id).classList.add('on'); window.scrollTo(0,0); };
  if(instant) return show();
  if(busy) return; busy = true;
  const w = $('#wipe'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
  setTimeout(show, 450);
  setTimeout(() => { busy = false; }, 900);
}

// ====== ЭФФЕКТЫ ======
document.addEventListener('click', e => {
  const b = e.target.closest('.btn'); if(!b) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height);
  const s = document.createElement('span'); s.className = 'rip';
  s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s); setTimeout(() => s.remove(), 600);
});
document.addEventListener('mousemove', e => {
  const c = e.target.closest('.role'); if(!c) return;
  const r = c.getBoundingClientRect(), x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
  c.style.transform = `perspective(600px) rotateY(${x*18}deg) rotateX(${-y*18}deg) scale(1.06)`;
});
document.addEventListener('mouseout', e => { const c = e.target.closest('.role'); if(c) c.style.transform = ''; });
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 2400); }
function confetti(){
  const cols = ['#7c5cff','#00d4ff','#ff4fd8','#ffd23f','#3dff9a'];
  for(let i=0;i<70;i++){ const c = document.createElement('div'); c.className = 'conf';
    c.style.cssText = `left:${Math.random()*100}vw;background:${cols[i%5]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.4}s`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000); }
}
// фон: частицы
(function(){
  const cv = $('#bg'), x = cv.getContext('2d'); let W, Hh, ps = [];
  const rs = () => { W = cv.width = innerWidth; Hh = cv.height = innerHeight; }; rs(); addEventListener('resize', rs);
  for(let i=0;i<70;i++) ps.push({x:Math.random()*2000,y:Math.random()*1200,r:Math.random()*2.5+1,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,h:Math.random()*360});
  (function f(){
    const g = x.createLinearGradient(0,0,W,Hh); g.addColorStop(0,'#0b0b1a'); g.addColorStop(1,'#1a0b2e'); x.fillStyle = g; x.fillRect(0,0,W,Hh);
    ps.forEach((p,i) => { p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=Hh; if(p.y>Hh)p.y=0;
      x.fillStyle = `hsl(${p.h+performance.now()/40},90%,65%)`; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill();
      for(let j=i+1;j<ps.length;j++){ const q = ps[j], d = Math.hypot(p.x-q.x,p.y-q.y); if(d<110){ x.strokeStyle = `rgba(124,92,255,${1-d/110})`; x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(q.x,q.y); x.stroke(); } } });
    requestAnimationFrame(f);
  })();
})();

// ====== ИЗОБРАЖЕНИЯ ======
function readImg(file, max){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max/Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width*k; c.height = im.height*k; c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg', .75)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

// ====== РОЛИ И РЕГИСТРАЦИЯ ======
document.querySelectorAll('.role').forEach(el => el.onclick = () => {
  const role = el.dataset.role;
  if(role === 'giver'){ me = {...(me||{}), role}; LS.set('me', me); openMain(); }
  else if(me && me.gameId){ me.role = role; LS.set('me', me); openMain(); }
  else { regAvatar = null; $('#regAva').style.backgroundImage = ''; $('#regAva').textContent = '📷'; $('#regId').value = ''; go('s-reg'); }
});
let regAvatar = null;
$('#regAva').onclick = () => $('#regFile').click();
$('#regFile').onchange = async e => { const f = e.target.files[0]; if(!f) return;
  regAvatar = await readImg(f, 200); $('#regAva').style.backgroundImage = `url(${regAvatar})`; $('#regAva').textContent = ''; };
$('#regBack').onclick = () => go('s-role');
$('#regGo').onclick = () => {
  const id = $('#regId').value.trim();
  if(!id) return toast('Введи игровой ID');
  if(!regAvatar) return toast('Загрузи фото профиля');
  me = {...(me||{}), role:'receiver', gameId:id, avatar:regAvatar, uid: (me&&me.uid) || 'u'+Date.now()+Math.random().toString(36).slice(2,7)};
  LS.set('me', me); confetti(); openMain();
};

// ====== ГЛАВНОЕ МЕНЮ ======
function openMain(){
  const r = me.role === 'receiver';
  $('#myRole').textContent = r ? 'Получающий' : 'Отдающий';
  $('#myName').textContent = r ? 'ID: ' + me.gameId : 'Отдающий';
  const av = $('#myAva'); av.style.backgroundImage = r && me.avatar ? `url(${me.avatar})` : ''; av.textContent = r ? '' : '🎁';
  $('#createBtn').style.display = r ? '' : 'none';
  $('#demo').style.display = online ? 'none' : 'block';
  go('s-main'); refresh();
}
$('#changeRole').onclick = () => go('s-role');
$('#createBtn').onclick = () => { $('#pText').value = ''; $('#pFile').value = ''; $('#pPrev').style.display = 'none'; pImg = null; go('s-create'); };
$('#search').oninput = render;

async function refresh(){
  try { posts = await api.list(); } catch { toast('Не удалось загрузить объявления'); }
  render();
}
function render(){
  const q = $('#search').value.trim().toLowerCase(), box = $('#posts');
  const list = posts.filter(p => !q || (p.text||'').toLowerCase().includes(q) || String(p.game_id).toLowerCase().includes(q));
  if(!list.length){ box.innerHTML = `<div class="empty">${posts.length ? 'Ничего не найдено 🕵️' : 'Пока нет объявлений. Будь первым! ✨'}</div>`; return; }
  box.innerHTML = list.map((p,i) => `<div class="post" style="animation-delay:${Math.min(i,10)*.06}s">
    <div class="ph"><div class="mini" style="background-image:url(${esc(p.avatar)})"></div><div><b>ID: ${esc(p.game_id)}</b><br><small style="opacity:.6">${new Date(p.created_at).toLocaleString('ru-RU')}</small></div></div>
    <p>${esc(p.text)}</p>${p.image ? `<img src="${esc(p.image)}" alt="">` : ''}
    ${me.role === 'giver' ? `<button class="btn" data-id="${esc(p.id)}">💌 Откликнуться</button>` : ''}
    ${me.role === 'receiver' && p.author && p.author === myId() ? `<button class="btn g" data-del="${esc(p.id)}">🗑 Удалить пост</button>` : ''}</div>`).join('');
  box.querySelectorAll('[data-id]').forEach(b => b.onclick = () => openResp(posts.find(p => String(p.id) === b.dataset.id)));
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Удалить это объявление?')) return;
    try { await api.del(b.dataset.del); toast('Пост удалён 🗑'); refresh(); } catch { toast('Не удалось удалить пост'); }
  });
}
setInterval(() => { if($('#s-main').classList.contains('on') && !$('#modal').classList.contains('on')) refresh(); }, 10000);

// ====== СОЗДАНИЕ ПОСТА ======
let pImg = null;
$('#pFile').onchange = async e => { const f = e.target.files[0]; if(!f) return;
  pImg = await readImg(f, 800); const p = $('#pPrev'); p.src = pImg; p.style.display = 'block'; };
$('#pBack').onclick = () => go('s-main');
$('#pGo').onclick = async () => {
  const text = $('#pText').value.trim();
  if(!text) return toast('Напиши текст объявления');
  try {
    await api.add({ author: me.uid, game_id: me.gameId, avatar: me.avatar, text, image: pImg });
    confetti(); toast('Объявление опубликовано! 🎉'); openMain();
  } catch { toast('Ошибка публикации, проверь настройки БД'); }
};

// ====== ОТКЛИК ======
function openResp(p){
  $('#mBody').innerHTML = `<h2>Объявление</h2>
    <div class="ph"><div class="mini" style="background-image:url(${esc(p.avatar)});width:44px;height:44px;border-radius:50%;background-size:cover"></div><b>ID: ${esc(p.game_id)}</b></div>
    <p style="white-space:pre-wrap;word-break:break-word;line-height:1.45">${esc(p.text)}</p>
    ${p.image ? `<img src="${esc(p.image)}" style="width:100%;border-radius:12px;margin-top:10px">` : ''}
    <div class="idbox">Возникли вопросы к просящему?<br>Вот его игровой ID: <b>${esc(p.game_id)}</b></div>
    <button class="btn full" id="cp">📋 Скопировать ID</button>
    <button class="btn g full" id="cl">Закрыть</button>`;
  $('#modal').classList.add('on');
  $('#cl').onclick = () => $('#modal').classList.remove('on');
  $('#cp').onclick = () => { navigator.clipboard?.writeText(p.game_id).then(() => toast('ID скопирован ✅')).catch(() => toast('Выдели ID и скопируй вручную')); };
}
$('#modal').onclick = e => { if(e.target.id === 'modal') $('#modal').classList.remove('on'); };

// ====== СТАРТ ======
// Уже регистрировался: сразу в главное меню, без повторных вопросов
if(me && me.role) openMain(); else go('s-role', true);
</script>
</body>
</html>
